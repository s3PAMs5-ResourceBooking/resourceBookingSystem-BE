# Nadpisania dla VPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Wszystkie porty tylko na 127.0.0.1 — dostęp przez tunel SSH, a docelowo przez nginx z HTTPS.
# Hasła i adresy w pliku .env obok (wzór: .env.example).
services:
  postgres:
    restart: unless-stopped
    ports: !override ["127.0.0.1:5432:5432"]

  keycloak:
    restart: unless-stopped
    ports: !override ["127.0.0.1:8180:8080"]
    environment:
      # za nginx z HTTPS: nagłówki X-Forwarded-* od proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"

  mailpit:
    restart: unless-stopped
    ports: !override ["127.0.0.1:8025:8025"]

  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:?ustaw BACKEND_IMAGE w .env}
    restart: unless-stopped
    ports: !override ["127.0.0.1:8080:8080"]
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
